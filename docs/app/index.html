<!DOCTYPE html>
<html>
<head>
  <base href="/VntApp/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VNT APP - 跨平台虚拟网络工具">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VNT APP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>VNT APP</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.72), transparent 42%),
        linear-gradient(160deg, #f6efe8 0%, #ede4dc 45%, #ddd5d2 100%);
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      color: #4f3f3f;
    }
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .dot {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-block;
      animation: slide 1s infinite ease-in-out;
      box-shadow: 0 10px 24px rgba(174, 74, 74, 0.18);
    }
    .dot:nth-child(1) {
      animation-delay: 0.1s;
      background: #ff9a76;
    }
    .dot:nth-child(2) {
      animation-delay: 0.2s;
      background: #ff7c66;
    }
    .dot:nth-child(3) {
      animation-delay: 0.3s;
      background: #f35d5d;
    }
    .dot:nth-child(4) {
      animation-delay: 0.4s;
      background: #df4d64;
    }
    .dot:nth-child(5) {
      animation-delay: 0.5s;
      background: #c5456a;
    }
    .loading-text {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }
    @keyframes slide {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(2);
        opacity: 0.3;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    @media (max-width: 640px) {
      .loader {
        gap: 8px;
      }
      .dot {
        width: 18px;
        height: 18px;
      }
      .loading-text {
        font-size: 14px;
        letter-spacing: 0.08em;
      }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="loader" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p class="loading-text">VNT APP加载中...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
